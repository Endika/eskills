name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Without a user token the release PR is opened by GITHUB_TOKEN, which triggers
          # no other workflow: the PR gets zero checks and branch protection blocks it
          # forever, waiting on a manual approval. all-green is required here now, so the
          # earlier "no required checks, GITHUB_TOKEN is fine" reasoning no longer holds.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: gh pr merge --rebase --auto -R "$REPO" "$(echo "$PR_JSON" | jq -r .number)"
